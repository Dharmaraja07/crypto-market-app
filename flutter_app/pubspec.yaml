name: crypto_market_app
description: "A production-quality cryptocurrency market research mobile application inspired by CoinGecko."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.2.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  flutter_bloc: ^8.1.6
  equatable: ^2.0.5
  dio: ^5.7.0
  go_router: ^14.6.0
  fl_chart: ^0.69.0
  shared_preferences: ^2.3.2
  intl: ^0.19.0
  cached_network_image: ^3.4.1
  google_fonts: ^6.2.1
  shimmer: ^3.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  bloc_test: ^9.1.7
  mocktail: ^1.0.4

flutter:
  uses-material-design: true

  assets:
    - assets/google_fonts/

  fonts:
    - family: Inter
      fonts:
        - asset: assets/google_fonts/Inter-Thin.ttf
          weight: 100
        - asset: assets/google_fonts/Inter-ExtraLight.ttf
          weight: 200
        - asset: assets/google_fonts/Inter-Light.ttf
          weight: 300
        - asset: assets/google_fonts/Inter-Regular.ttf
          weight: 400
        - asset: assets/google_fonts/Inter-Medium.ttf
          weight: 500
        - asset: assets/google_fonts/Inter-SemiBold.ttf
          weight: 600
        - asset: assets/google_fonts/Inter-Bold.ttf
          weight: 700
        - asset: assets/google_fonts/Inter-ExtraBold.ttf
          weight: 800
        - asset: assets/google_fonts/Inter-Black.ttf
          weight: 900
