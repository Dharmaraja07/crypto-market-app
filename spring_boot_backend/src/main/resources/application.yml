server:
  port: ${PORT:8080}
  shutdown: graceful

spring:
  application:
    name: crypto-market-backend
  profiles:
    active: dev
  datasource:
    url: jdbc:h2:mem:cryptodb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=PostgreSQL
    driverClassName: org.h2.Driver
    username: sa
    password: 
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: false
  h2:
    console:
      enabled: true
      path: /h2-console
  cache:
    type: caffeine
    cache-names:
      - marketOverview
      - coinList
      - coinDetails
      - coinCharts
      - trendingCoins
      - searchCoins

# External API configuration
crypto:
  coingecko:
    base-url: ${COINGECKO_BASE_URL:https://api.coingecko.com/api/v3}
    api-key: ${COINGECKO_API_KEY:}
    api-key-header: ${COINGECKO_HEADER:x-cg-demo-api-key}
    timeout-seconds: 10
    retry-attempts: 2
    mock-fallback-enabled: true

# Cache TTL settings in minutes
cache:
  caffeine:
    spec: maximumSize=500,expireAfterWrite=120s

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    tags-sorter: alpha
    operations-sorter: method
